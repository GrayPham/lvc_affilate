[package]
name = "lvc-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Tauri 2: ten lib khac ten package (quy uoc "<ten>_lib") vi mobile (khong ap dung o day, Windows-only)
# can lib rieng ben canh binary "lvc-app" (src/main.rs).
[lib]
name = "lvc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lvc-core.workspace = true
lvc-store.workspace = true
lvc-browser.workspace = true
lvc-engine.workspace = true
lvc-vault.workspace = true
# P4a (ADR-R014): registry node — MOI node module 1 dong o day + 1 dong o src/registry.rs.
lvc-node-api.workspace = true
node-prompt.workspace = true
node-image-upload.workspace = true
node-save.workspace = true
node-dola-video.workspace = true
node-concat.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# log.rs: ghi logs/app.log xoay theo ngay (chinh sach log, khong bao gio in cookie/prompt/proxy).
tracing-appender = "0.2.5"
# commands/mod.rs: Ctx.runs (run_id -> CancellationToken huy nhanh, fix-round 1 I1).
dashmap = "6"
# commands/mod.rs (fix-round 1, I1): CancellationToken luu trong Ctx.runs.
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# sync: Ctx.settings dung tokio::sync::RwLock (giu qua diem await trong Tauri command Task 9/10);
# rt: commands/*.rs goi `tokio::spawn`/`#[tokio::test]` — ghi tuong minh thay vi trong cay vao hop
# nhat tinh nang tu workspace (M7, fix-round 1 review).
tokio = { workspace = true, features = ["sync", "rt"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# commands/workflow.rs (Task 9): id workflow moi khi workflow_save khong truyen id (uuid v4).
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

# Task 12a (P3): che do dev khong ton credit — `cargo tauri dev --features fake-driver` doi
# `AppDriver` (state.rs) tu `ChromiumDriver` sang `lvc_browser::fake::FakeDriver::endless_ok`
# (bootstrap.rs::make_driver). Ban release KHONG bat feature nay (tat mac dinh).
[features]
fake-driver = []

[lints]
workspace = true
