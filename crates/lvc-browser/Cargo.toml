[package]
name = "lvc-browser"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lvc-core.workspace = true
chromiumoxide.workspace = true
async-trait.workspace = true
futures.workspace = true
# io-util: dola::http::download ghi stream vao file bang `AsyncWriteExt` (tokio::fs).
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# dola::labels: regex nhan Dola (cung crate/phien ban voi lvc-core).
regex = "1"
# dola::refs: base64 anh tham chieu cho PASTE_TRIGGER_JS (cung phien ban voi lvc-core).
base64.workspace = true
# dola::http (Task 10): HttpSession.poll / fetch_raw_video / _download bang reqwest (aiohttp o Python);
# uuid v4 cho `web_tab_id` + `sequence_id` (hub_browser.py:856-860).
reqwest.workspace = true
uuid.workspace = true

# Task 13: job.rs (Job Object) chi build tren Windows.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile = "3"
# dola::http tests: mock server HTTP cuc bo (kiem header/body/query, tra fixture) — khong dola.com.
wiremock.workspace = true
# tests/ops_smoke.rs: server HTTP cuc bo ti hon (TcpListener) phuc vu fixture - file:// khong
# cho fetch() (CORS) nen Network.responseReceived khong bao gio ban (do 2026-09-18).
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
