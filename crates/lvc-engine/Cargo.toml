[package]
name = "lvc-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lvc-core.workspace = true
lvc-store.workspace = true
lvc-browser.workspace = true
# P4a (ADR-R014): engine generic theo registry node; impl dich vu DolaVideoHost cho node dola_video.
lvc-node-api.workspace = true
lvc-dola.workspace = true
# P4d: provider sinh text (client HTTP Gemini/OpenAI) — engine impl dich vu TextGenHost cho node
# script_gen (resolve API key tu vault qua TextSecretResolver roi goi client nay).
lvc-genai.workspace = true
# P5 Task 9: provider Google Labs Flow/Veo3 — engine impl dich vu VeoCaptchaHost (mint reCAPTCHA
# qua lvc-browser::veo3::captcha) cho node veo3_image/veo3_video.
lvc-veo3.workspace = true
# P6: provider API CHINH THUC Google (Nano Banana/Veo) — engine impl GoogleImageHost/GoogleVideoHost
# cho node google_image/google_video (resolve API key tu vault qua TextSecretResolver roi goi client).
lvc-google.workspace = true
# P6: provider API CHINH THUC Seedance/Seedream (Volcengine) + Grok (xAI) — engine impl host trait
# tuong ung cho node seedance_*/grok_image. Cung khuon lvc-google.
lvc-seedance.workspace = true
lvc-grok.workspace = true
lvc-tts.workspace = true
# museai.rs: client giao thuc Hatch/Noise cua muse.ai — engine impl dich vu MuseaiVideoHost cho
# node museai_video (mo trinh duyet that lay bootstrap token roi noi qua lvc-museai::protocol).
lvc-museai.workspace = true
# scriptsink.rs: hop dong dich vu ScriptSinkHost (luu ket qua node script_gen thanh kich ban trong
# tab "Kịch bản") — engine impl bang lvc-store::ScriptRepo (da la dependency tren).
lvc-scripts.workspace = true
async-trait.workspace = true
# P6 apimedia/util.rs: dung data URL base64 cho anh goc i2v (Seedance nhan image_url).
base64.workspace = true
# limiter.rs (Task 15): watch + Notify. pool.rs (Task 16) can them "time" cho cooldown/rate_limited —
# da co san qua workspace tokio (rt-multi-thread, macros, fs, time).
tokio = { workspace = true, features = ["sync"] }
# cancel.rs (P3 Task 4, R4): `CancellationToken` (cay token cha/con) cho huy `generate_video`.
tokio-util.workspace = true
# pool.rs (Task 16): DashMap<AccountId, Arc<tokio::Mutex<()>>> (spec §5.2);
# cancel.rs (P3 Task 4): DashMap<task_id, CancellationToken>.
dashmap = "6"
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
# cli.rs (Task 18): JSON tong ket cua gen_one (stdout).
serde_json.workspace = true
# dag.rs (P3 Task 7): id cho run/task (uuid v4) — da la dependency workspace (lvc-browser dung
# cho web_tab_id/sequence_id), o day chi khai bao them cho lvc-engine.
uuid.workspace = true

[dev-dependencies]
# P4a: test DAG/kich ban dung node module that (chi dev — engine KHONG phu thuoc node khi build).
node-prompt.workspace = true
node-image-upload.workspace = true
node-save.workspace = true
node-dola-video.workspace = true
# Script-video (P-affiliate-multi-engine): test registry day du 4 node video — xem
# `test_support::test_registry_all_video`.
node-veo3-video.workspace = true
node-google-video.workspace = true
node-seedance-video.workspace = true
# examples/museai_gen_one.rs: thi nghiem song MOT LAN sinh video MuseAI that.
node-museai-video.workspace = true
# pool.rs (Task 16): accounts_dir gia (thu muc profile phai ton tai — browser_pool.py:405-411).
tempfile = "3"
# examples/gen_one.rs (Task 18): tracing ra stderr, env filter; CHI cho example/test (dev-dep).
# accounts.rs (Task 10): capture log (`fmt::MakeWriter`) de ghim "khong bao gio log gia tri cookie".
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# accounts.rs (Task 10): test `import_legacy` tu dung tao 2 DB Python cu toi thieu (tasks.db,
# pool_usage.db) — cung cach lvc-store/tests/legacy_import.rs lam.
sqlx = { workspace = true }

[lints]
workspace = true
