[package]
name = "lvc-museai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Provider MuseAI (muse.ai). Port tu `E:\ProjectAILVC\Lvc_veo3_automation\src\core\museai\protocol\`
# (tham khao, CHI DOC) — client giao thuc Hatch/Noise cua muse.ai (Noise_XX_25519_AESGCM_SHA256,
# giao thuc crypto CHUAN cong khai noiseprotocol.org, khong phai chu ky chong-bot rieng kieu Dola).
# LUAT: KHONG biet khai niem node (khong phu thuoc lvc-node-api), KHONG phu thuoc lvc-engine/store.
[dependencies]
async-trait.workspace = true
thiserror.workspace = true
sha2.workspace = true
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
# attachments.rs: anh tham chieu nhung base64 thang vao `/chat/stream` (muse.ai khong co endpoint
# tai anh rieng).
base64.workspace = true
# transport.rs: ket noi WebSocket toi cong Hatch (wss://hatch.metaaivm.com) — client CHUAN, KHONG
# gia mao TLS fingerprint (khac han curl_cffi cua auth.py ban Python, CO Y khong port phan do, xem
# CLAUDE.md "boi canh rui ro").
tokio = { workspace = true, features = ["sync", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
hex = "0.4"

[lints]
workspace = true
