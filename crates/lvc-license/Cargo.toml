[package]
name = "lvc-license"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Cong ban quyen LVC Shop (port 1:1 tu LVC Veo3): dang nhap tai khoan -> kich hoat license, verify
# phan hoi server bang ECDSA P-256 (4 lop guard), ECDH/HKDF/Fernet cho payload, session cache offline.
# LUAT: khong log bi mat (password/license/JWT/session plaintext/Fernet key). rustls-only (khong OpenSSL).
[dependencies]
p256.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
# Parse timestamp ISO cho lop 4 guard (clock skew). chrono dung o Task 2, khong phai Task 6.
chrono.workspace = true
# crypto.rs: ECDH (p256) -> HKDF -> Fernet tu viet (AES-128-CBC + HMAC-SHA256). rustls-only.
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
aes.workspace = true
cbc.workspace = true
rand.workspace = true

[target.'cfg(windows)'.dependencies]
# device.rs: doc MachineGuid tu registry lam device_id on dinh.
winreg.workspace = true

[lints]
workspace = true
