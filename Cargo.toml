[workspace]
resolver = "3"
members = [
    "crates/lvc-core",
    "crates/lvc-store",
    "crates/lvc-browser",
    "crates/lvc-engine",
    "crates/lvc-app",
    "crates/lvc-node-api",
    "crates/lvc-vault",
    "crates/lvc-license",
    "crates/providers/lvc-dola",
    "crates/providers/lvc-genai",
    "crates/providers/lvc-veo3",
    "crates/providers/lvc-google",
    "crates/providers/lvc-seedance",
    "crates/providers/lvc-grok",
    "crates/providers/lvc-github",
    "crates/providers/lvc-template-registry",
    "crates/providers/lvc-scripts",
    "crates/providers/lvc-museai",
    "crates/providers/lvc-tts",
    "crates/nodes/node-prompt",
    "crates/nodes/node-image-upload",
    "crates/nodes/node-save",
    "crates/nodes/node-dola-video",
    "crates/nodes/node-concat",
    "crates/nodes/node-trim",
    "crates/nodes/node-frame-capture",
    "crates/nodes/node-load-video",
    "crates/nodes/node-audio-extract",
    "crates/nodes/node-audio-split",
    "crates/nodes/node-script-gen",
    "crates/nodes/node-veo3-video",
    "crates/nodes/node-veo3-image",
    "crates/nodes/node-google-image",
    "crates/nodes/node-google-video",
    "crates/nodes/node-seedance-image",
    "crates/nodes/node-seedance-video",
    "crates/nodes/node-grok-image",
    "crates/nodes/node-museai-video",
    "crates/nodes/node-museai-image",
    "crates/nodes/node-script-agent",
    "crates/nodes/node-note",
    "crates/nodes/node-tts",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cong ban quyen LVC Shop (crates/lvc-license): verify ECDSA P-256 + ECDH/HKDF/Fernet tu viet.
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem"] }
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
winreg = "0.52"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
lvc-core = { path = "crates/lvc-core" }
lvc-store = { path = "crates/lvc-store" }
lvc-engine = { path = "crates/lvc-engine" }
chromiumoxide = "0.9"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
lvc-browser = { path = "crates/lvc-browser" }
# P4a (ADR-R014): hop dong node + provider + node module.
lvc-node-api = { path = "crates/lvc-node-api" }
lvc-vault = { path = "crates/lvc-vault" }
lvc-license = { path = "crates/lvc-license" }
lvc-dola = { path = "crates/providers/lvc-dola" }
node-note = { path = "crates/nodes/node-note" }
node-script-agent = { path = "crates/nodes/node-script-agent" }
node-museai-image = { path = "crates/nodes/node-museai-image" }
node-museai-video = { path = "crates/nodes/node-museai-video" }
node-veo3-image = { path = "crates/nodes/node-veo3-image" }
node-veo3-video = { path = "crates/nodes/node-veo3-video" }
lvc-veo3 = { path = "crates/providers/lvc-veo3" }
node-audio-split = { path = "crates/nodes/node-audio-split" }
node-audio-extract = { path = "crates/nodes/node-audio-extract" }
lvc-genai = { path = "crates/providers/lvc-genai" }
lvc-google = { path = "crates/providers/lvc-google" }
lvc-seedance = { path = "crates/providers/lvc-seedance" }
lvc-grok = { path = "crates/providers/lvc-grok" }
lvc-github = { path = "crates/providers/lvc-github" }
lvc-template-registry = { path = "crates/providers/lvc-template-registry" }
lvc-scripts = { path = "crates/providers/lvc-scripts" }
lvc-museai = { path = "crates/providers/lvc-museai" }
lvc-tts = { path = "crates/providers/lvc-tts" }
node-tts = { path = "crates/nodes/node-tts" }
hex = "0.4"
node-google-image = { path = "crates/nodes/node-google-image" }
node-google-video = { path = "crates/nodes/node-google-video" }
node-seedance-image = { path = "crates/nodes/node-seedance-image" }
node-seedance-video = { path = "crates/nodes/node-seedance-video" }
node-grok-image = { path = "crates/nodes/node-grok-image" }
node-script-gen = { path = "crates/nodes/node-script-gen" }
node-load-video = { path = "crates/nodes/node-load-video" }
node-frame-capture = { path = "crates/nodes/node-frame-capture" }
node-trim = { path = "crates/nodes/node-trim" }
node-concat = { path = "crates/nodes/node-concat" }
node-prompt = { path = "crates/nodes/node-prompt" }
node-image-upload = { path = "crates/nodes/node-image-upload" }
node-save = { path = "crates/nodes/node-save" }
node-dola-video = { path = "crates/nodes/node-dola-video" }
tokio-util = { version = "0.7", features = ["rt"] }
# Task 10 (dola::http): poll /im/chain/single + tai mp4. rustls (khong OpenSSL), json/stream,
# socks (proxy socks5://), gzip/brotli (aiohttp tu giai nen — reqwest chi giai nen khi bat feature).
# CHI lvc-browser duoc dung (lvc-core phai thuan — scripts/check.ps1 kiem `cargo tree`).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks", "gzip", "brotli"] }
uuid = { version = "1", features = ["v4"] }
# dev: server HTTP gia cho test dola::http (khong bao gio goi dola.com trong test).
wiremock = "0.6"
# Task 13 (lvc-browser::job, chi Windows): Job Object KILL_ON_JOB_CLOSE de Chrome chet theo tien trinh
# nay. `Win32_Security` can cho chu ky `CreateJobObjectW(*const SECURITY_ATTRIBUTES, ..)`.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
